spring.application.name=http-tracing
server.port=8080

# --- Tracing (context propagation + log correlation only) ---
# Tracing is on by default: the incoming W3C `traceparent` is extracted and
# traceId/spanId are put into the logging MDC.
management.tracing.propagation.type=w3c
# Sample everything (parent-based: a client traceparent with flags=00 stays unsampled)
management.tracing.sampling.probability=1.0

# --- Span export ---
# Spans are not exported: no exporter library (OTLP, Zipkin, ...) is on the classpath.
# If one is ever added, disable it with management.tracing.export.<exporter>.enabled=false.
# Do NOT use the global management.tracing.export.enabled=false: in Boot 4 it also turns off
# traceparent propagation, so the client's traceId would be ignored.

# --- Logging ---
# Adds [appName,traceId,spanId,parentSpanId] to every log line (parentSpanId = span id sent by the client
# in traceparent, put in the MDC by TraceparentMdcFilter). The raw header is also in the MDC as %X{traceparent}.
logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-},parentSpanId=%X{parentSpanId:-}] 
logging.include-application-name=false
